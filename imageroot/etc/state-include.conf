# Paths included in the module backup (state/environment is always included).
#   state/passwords.env   generated and admin-provided secrets
#   state/huginn.sql      MariaDB dump written by module-dump-state
#   state/custom_agents   agent classes uploaded by the admin
#   state/agents-export   every user's agents as scenario JSON (readable copy)
# The live MariaDB data directory (huginn-mysql) is NOT copied: restore-module
# rebuilds it from the dump.
state/passwords.env
state/huginn.sql
state/custom_agents
state/agents-export
